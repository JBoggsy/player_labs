[project]
name = "player-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coworld[auth]>=0.1.35",
    # Python semantic-player contract for local tests, kept in step with the
    # canonical vanilla-wow 0.1.208 image pinned in vanilla_wow_lab/tools/versions.env.
    "vanilla-wow-coworld @ git+https://github.com/Metta-AI/coworld-vanilla-wow.git@b92f4961c97cc918b7e46e2c39db778f01df2487",
    "httpx>=0.28.1",
    # The shared player SDK that vendored players import as `players.player_sdk`,
    # plus its base deps (anthropic, boto3 for Bedrock, etc.). The `players` repo moved
    # into the Metta-AI/coworld-tools monorepo as the `players/` subdirectory, so we
    # install it from coworld-tools' GitHub source TARBALL (see [tool.uv.sources]).
    # Tarball (not a git source) on purpose: a GitHub archive excludes submodules, which
    # sidesteps coworld-tools' broken `players/users/relh/co-gas` submodule that fails
    # uv's recursive git clone (coworld-tools issue #13). This matches what the hosted
    # image builds against (Dockerfile + tools/versions.env PLAYERS_SDK_REF). To adopt a
    # newer SDK, bump the tarball SHA below to coworld-tools' current `main`
    # (`git ls-remote https://github.com/Metta-AI/coworld-tools main`) and `uv lock`.
    # `[bedrock]` pulls boto3 to match the hosted image's `players[bedrock]` install — the
    # SDK lazy-imports boto3 only when use_bedrock=True, so it's inert locally (no sidecar).
    "players[bedrock]",
    # crewborg's direct third-party deps (vendored fork under crewrift_lab/crewrift/crewborg/)
    "numpy>=2.0.0",
    "pydantic>=2.12.2",
    "websockets>=16.0",
    "cramjam>=2.8.0",
    # Meeting chat NLP (crewborg imposter bandwagon, design §10.5): dependency-parse
    # negation scope on opponents' chat. Loaded lazily in the background and gated by
    # CREWBORG_CHAT_NLP, so it never touches the gameplay hot path. The en_core_web_sm
    # model is pinned by URL for reproducible installs; keep it in sync with spaCy's
    # minor version.
    "spacy>=3.8.0,<3.9.0",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "cryptography>=49.0.0",
    "pillow>=12.3.0",
    "duckdb>=1.5.4",
    "scipy>=1.17.1",
    "matplotlib>=3.11.0",
    "huggingface-hub>=1.26.1",
    "tokenizers>=0.22,<0.24",
]

[tool.uv.sources]
# coworld-tools tarball (NOT git) — see the `players` dependency comment above for why
# (avoids the broken co-gas submodule that breaks uv's recursive clone). SHA = coworld-tools
# `main` as of 2026-08-06. This revision preserves all eight Sprite-v1 input
# bits; older revisions clamped masks to 0x7f and silently dropped Button C.
players = { url = "https://github.com/Metta-AI/coworld-tools/archive/4dd923d1adf4d805efb3efe55f1351aeae9c9075.tar.gz", subdirectory = "players" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist",
]
rl = [
    "accelerate>=1.10,<2",
    "cramjam>=2.8.0",
    "datasets>=4.8,<5",
    "numpy>=2.0.0",
    "peft>=0.17,<1",
    "torch>=2.8,<2.12",
    "transformers>=4.51,<6",
]

# Vendored players live under each game lab, grouped by game (e.g. crewrift.crewborg
# under crewrift_lab/, cady under heartleaf_lab/). Each is a true in-lab fork, free to
# drift; only the shared SDK is imported from the players dependency. Exposing each lab
# as a packages source root makes `from crewrift.crewborg import build_runtime` and
# `import cady` importable after uv sync (editable — edits are live).
#
# crewborg (crewrift), cady (heartleaf), and beacon (ctf) are Python policies. notsus and
# suspectra are vendored *Nim* players (source-only; built externally via their Dockerfiles)
# — they are NOT Python packages, so they're excluded from discovery even though suspectra
# carries an upstream-packaging __init__.py.
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["crewrift_lab", "heartleaf_lab", "ctf_lab", "vanilla_wow_lab", "paintbot_lab"]
include = ["crewrift*", "cady*", "ctf*", "wowborg*"]
exclude = ["crewrift.notsus*", "crewrift.suspectra*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The RL corpus dir holds full game-repo worktrees (untracked); collecting their
# CI tests raises duplicate-basename import errors. This setting REPLACES pytest's
# defaults, so they are restated here — dropping `.*` would start collecting the
# labs' `.cache/` game checkouts, which fail the same way.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "paintbot_lab/paintbot/rl/data",
]
