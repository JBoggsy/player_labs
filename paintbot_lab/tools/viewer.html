<!DOCTYPE html>
<!--
  CTF-family belief-overlay replay viewer.

  Feed it a bundle from tools/viewer_bundle.py (ground-truth per-tick positions +
  events from the re-sim, agent belief traces from the artifact zips, the wall
  mask). Renders the game on canvas and overlays ONE selected bot's perception
  and beliefs: vision polygon, hearing radius, heard chats/sounds, enemy/ally
  track beliefs, danger and ally-coverage heatmaps, goal + path, squadmate
  presence, item beliefs.

  Overlay data comes from trace SNAPSHOTS (cadence STENCIL_DIAG_EVERY_TICKS or
  BEACON_DIAG_EVERY_TICKS, default 96) — the "belief age" readout shows how
  stale the overlay is at the current tick. Set the applicable cadence to 1 for
  frame-accurate overlays.

  Keyboard: space = play/pause · ←/→ = step one tick · shift+←/→ = jump 24.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Belief replay viewer</title>
<style>
  :root {
    --paper: #faf9f6; --ink: #1a1815; --ink-soft: #5f5a52; --hairline: #e3ded6;
    --red: #b3402e; --blue: #2e5cb3; --green: #3f7d3a; --yellow: #b28a16;
    --accent: #8a6d1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 13px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvasWrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { max-width: 100%; max-height: 100%; }
  #panel {
    width: 300px; padding: 18px 20px; overflow-y: auto;
    border-left: 1px solid var(--hairline);
  }
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 2px; letter-spacing: .01em; }
  .sub { color: var(--ink-soft); font-size: 12px; margin: 0 0 14px; }
  .section { margin: 16px 0 0; }
  .section > .label {
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  select, input[type=file] {
    width: 100%; padding: 5px 6px; font: inherit; color: var(--ink);
    background: var(--paper); border: 1px solid var(--hairline); border-radius: 3px;
  }
  label.toggle { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; cursor: pointer; }
  label.toggle input { accent-color: var(--ink); }
  label.toggle .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  #transport {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-top: 1px solid var(--hairline);
  }
  #transport button {
    font: inherit; padding: 4px 10px; background: var(--paper); color: var(--ink);
    border: 1px solid var(--hairline); border-radius: 3px; cursor: pointer;
  }
  #transport button:hover { border-color: var(--ink-soft); }
  #scrub { flex: 1; accent-color: var(--ink); }
  #tickReadout { font-variant-numeric: tabular-nums; color: var(--ink-soft); min-width: 130px; }
  #status { padding: 4px 16px 10px; color: var(--ink-soft); font-size: 12px;
            font-variant-numeric: tabular-nums; }
  #beliefAge { color: var(--accent); }
  .drop { border: 1px dashed var(--hairline); border-radius: 4px; padding: 18px;
          text-align: center; color: var(--ink-soft); margin-top: 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="canvasWrap"><canvas id="cv" width="1235" height="659"></canvas></div>
  <div id="transport">
    <button id="btnPlay" title="space">▶</button>
    <button id="btnStepBack" title="←">‹ tick</button>
    <button id="btnStepFwd" title="→">tick ›</button>
    <select id="speed" style="width:auto">
      <option value="0.25">0.25×</option><option value="1" selected>1×</option>
      <option value="4">4×</option><option value="12">12×</option>
    </select>
    <input id="scrub" type="range" min="0" max="0" value="0">
    <span id="tickReadout">tick — / —</span>
  </div>
  <div id="status">load a bundle to begin</div>
</div>

<div id="panel">
  <h1>Belief replay viewer</h1>
  <p class="sub">ground truth below, one bot's head above it</p>

  <div class="section">
    <div class="label">Bundle</div>
    <input type="file" id="file" accept=".json">
  </div>

  <div class="section">
    <div class="label">Overlay agent</div>
    <select id="agent"><option value="">— global (no overlay) —</option></select>
    <div class="sub" style="margin-top:5px">belief age: <span id="beliefAge">—</span></div>
  </div>

  <div class="section">
    <div class="label">Perception</div>
    <label class="toggle"><input type="checkbox" id="t_vision" checked><span class="swatch" style="background:#e8d99022"></span>vision polygon (±45° cone + 90px bubble)</label>
    <label class="toggle"><input type="checkbox" id="t_hearing" checked><span class="swatch" style="background:#8a6d1f"></span>chat hearing radius (~247px; sounds are map-wide)</label>
    <label class="toggle"><input type="checkbox" id="t_heard" checked><span class="swatch" style="background:#8a6d1f"></span>heard chats + sounds</label>
  </div>

  <div class="section">
    <div class="label">Beliefs</div>
    <label class="toggle"><input type="checkbox" id="t_enemies" checked><span class="swatch" style="background:#b3402e"></span>enemy tracks (age-faded)</label>
    <label class="toggle"><input type="checkbox" id="t_allies" checked><span class="swatch" style="background:#2e5cb3"></span>ally tracks + observed headings</label>
    <label class="toggle"><input type="checkbox" id="t_squad" checked><span class="swatch" style="background:#2e5cb3"></span>squadmate presence (staleness rings)</label>
    <label class="toggle"><input type="checkbox" id="t_items" checked><span class="swatch" style="background:#3f7d3a"></span>item beliefs (present / believed-absent)</label>
    <label class="toggle"><input type="checkbox" id="t_covered" checked><span class="swatch" style="background:#2e8b5733"></span>ally gun coverage (visible + fresh tracks, LoS)</label>
    <label class="toggle"><input type="checkbox" id="t_danger"><span class="swatch" style="background:#b3402e33"></span>danger heatmap</label>
    <div class="sub" id="beliefStats" style="margin-top:7px">select an agent to inspect heatmap telemetry</div>
  </div>

  <div class="section">
    <div class="label">Decision</div>
    <label class="toggle"><input type="checkbox" id="t_goal" checked><span class="swatch" style="background:#1a1815"></span>goal point + order (goal/source/age)</label>
    <label class="toggle"><input type="checkbox" id="t_path" checked><span class="swatch" style="background:#1a1815"></span>pathing route</label>
    <label class="toggle"><input type="checkbox" id="t_state" checked><span class="swatch" style="background:#1a1815"></span>state card (objective · micro · hp · convert)</label>
  </div>

  <div class="section">
    <div class="label">World</div>
    <label class="toggle"><input type="checkbox" id="t_names" checked><span class="swatch"></span>seat labels</label>
    <label class="toggle"><input type="checkbox" id="t_events" checked><span class="swatch"></span>kill / flag event flashes</label>
  </div>
</div>

<script>
"use strict";
let MAP_W = 1235, MAP_H = 659, CHAT_RANGE = Math.floor(MAP_W / 5);
const CONE_HALF_DEG = 45, BUBBLE = 90;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const queryParams = new URLSearchParams(location.search);

let B = null;            // the loaded bundle
let wall = null;         // Uint8Array MAP_W*MAP_H
let ticks = [];          // sorted engine ticks with pos data
let posByTick = new Map();   // tick -> [{slot,x,y,aim,alive,hp,carry,...}]
let flagsByTick = new Map();
let eventsByTick = new Map();
let tracesBySlot = new Map(); // slot -> {snapshots:[...], events:[...]} engine-tick sorted
let participantsBySlot = new Map();
let cur = 0;             // index into ticks
let playing = false, speedMul = 1, acc = 0, lastT = 0;

// ---------- load ----------
async function loadBundle(bundle, name) {
  status(`parsing ${name}…`);
  B = bundle;
  index();
  status(`${name} · ${B.episode?.coworld_version ?? "?"} · ${ticks.length} ticks · ` +
         `${Object.keys(B.traces || {}).length} traced bots`);
  draw();
}
document.getElementById("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  await loadBundle(JSON.parse(await f.text()), f.name);
});

// ?bundle=<path> auto-loads a same-origin bundle (needs an http server, e.g. plan_server.py).
const bundleParam = new URLSearchParams(location.search).get("bundle");
if (bundleParam) (async () => {
  status(`fetching ${bundleParam}…`);
  const resp = await fetch(bundleParam);
  if (!resp.ok) { status(`fetch failed (${resp.status}) for ${bundleParam}`); return; }
  B = JSON.parse(await resp.text());
  index();
  status(`${bundleParam} · ${B.episode?.coworld_version ?? "?"} · ${ticks.length} ticks · ` +
         `${Object.keys(B.traces || {}).length} traced bots`);
  draw();
})();

function status(s) { document.getElementById("status").innerHTML = s; }

function index() {
  MAP_W = B.wall.w; MAP_H = B.wall.h; CHAT_RANGE = Math.floor(MAP_W / 5);
  cv.width = MAP_W; cv.height = MAP_H;
  // Wall RLE -> bitmask.
  wall = new Uint8Array(MAP_W * MAP_H);
  B.wall.rows.forEach((runs, y) => {
    for (let i = 0; i < runs.length; i += 2)
      wall.fill(1, y * MAP_W + runs[i], y * MAP_W + runs[i] + runs[i + 1]);
  });
  posByTick.clear(); flagsByTick.clear(); eventsByTick.clear();
  participantsBySlot = new Map(
    (B.episode?.participants || []).map(participant => [participant.slot, participant])
  );
  for (const r of B.pos) {
    if (!posByTick.has(r.ts)) posByTick.set(r.ts, []);
    posByTick.get(r.ts).push({ slot: r.player, ...r.value });
  }
  for (const r of B.flags) {
    if (!flagsByTick.has(r.ts)) flagsByTick.set(r.ts, []);
    flagsByTick.get(r.ts).push(r.value);
  }
  for (const r of B.events) {
    if (!eventsByTick.has(r.ts)) eventsByTick.set(r.ts, []);
    eventsByTick.get(r.ts).push(r);
  }
  ticks = [...posByTick.keys()].sort((a, b) => a - b);
  const scrub = document.getElementById("scrub");
  scrub.max = ticks.length - 1; scrub.value = 0; cur = 0;

  // Traces: engine-align and split snapshots vs point events.
  tracesBySlot.clear();
  const agentSel = document.getElementById("agent");
  agentSel.innerHTML = '<option value="">— global (no overlay) —</option>';
  for (const [slotStr, recs] of Object.entries(B.traces || {})) {
    const slot = +slotStr, off = (B.trace_offsets || {})[slotStr] ?? 0;
    const snapshots = [], events = [];
    for (const r of recs) {
      const et = (r.tick ?? 0) + off;
      if (r.name === "snapshot" || (r.name === "worldmap" && r.data?.covered)) {
        snapshots.push({ t: et, d: r.data });
      }
      else events.push({ t: et, name: r.name, d: r.data });
    }
    snapshots.sort((a, b) => a.t - b.t); events.sort((a, b) => a.t - b.t);
    tracesBySlot.set(slot, { snapshots, events });
    const p = participantsBySlot.get(slot) || {};
    const seat = recs.find(r => r.data?.seat != null)?.data.seat ?? (slot >> 1);
    const team = recs.find(r => r.data?.team)?.data.team ?? p.team ??
      (slot % 2 === 0 ? "red" : "blue");
    agentSel.add(new Option(`${p.policy ?? "bot"}:${p.version ?? "?"} seat ${seat} (${team}, slot ${slot})`, slot));
  }
  const requestedAgent = queryParams.get("agent");
  if (requestedAgent != null && tracesBySlot.has(+requestedAgent)) {
    agentSel.value = requestedAgent;
  } else if (tracesBySlot.size === 1) {
    agentSel.value = tracesBySlot.keys().next().value;
  }
}

// ---------- playback ----------
const btnPlay = document.getElementById("btnPlay");
function setPlaying(p) { playing = p; btnPlay.textContent = p ? "❚❚" : "▶"; if (p) { lastT = performance.now(); requestAnimationFrame(tickLoop); } }
btnPlay.onclick = () => setPlaying(!playing);
document.getElementById("btnStepFwd").onclick = () => { setPlaying(false); seek(cur + 1); };
document.getElementById("btnStepBack").onclick = () => { setPlaying(false); seek(cur - 1); };
document.getElementById("speed").onchange = (e) => speedMul = +e.target.value;
document.getElementById("scrub").oninput = (e) => { setPlaying(false); seek(+e.target.value); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.code === "ArrowRight") seek(cur + (e.shiftKey ? 24 : 1));
  if (e.code === "ArrowLeft") seek(cur - (e.shiftKey ? 24 : 1));
});
for (const el of document.querySelectorAll("#panel input[type=checkbox], #agent"))
  el.addEventListener("change", draw);

function seek(i) {
  if (!ticks.length) return;
  cur = Math.max(0, Math.min(ticks.length - 1, i));
  document.getElementById("scrub").value = cur;
  draw();
}
function tickLoop(now) {
  if (!playing) return;
  acc += (now - lastT) / 1000 * 24 * speedMul; lastT = now;   // 24 engine ticks/sec
  if (acc >= 1) { const n = Math.floor(acc); acc -= n; seek(cur + n); }
  if (cur >= ticks.length - 1) setPlaying(false);
  requestAnimationFrame(tickLoop);
}

// ---------- helpers ----------
const on = id => document.getElementById(id).checked;
function wallAt(x, y) {
  x |= 0; y |= 0;
  return x < 0 || y < 0 || x >= MAP_W || y >= MAP_H ? 1 : wall[y * MAP_W + x];
}
function ray(x0, y0, ang, maxLen) {
  // March until a wall; return endpoint. 3px steps (matches beacon's coarse LoS).
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let d = 0;
  while (d < maxLen) {
    d += 3;
    if (wallAt(x0 + dx * d, y0 + dy * d)) return [x0 + dx * (d - 3), y0 + dy * (d - 3)];
  }
  return [x0 + dx * maxLen, y0 + dy * maxLen];
}
function brads2rad(b) { return -b / 256 * 2 * Math.PI; }  // brads are CCW on screen; canvas y is down
function teamColor(team, slot = 0) {
  const colors = { red: "#b3402e", blue: "#2e5cb3", green: "#3f7d3a", yellow: "#b28a16" };
  return colors[team] || (slot % 2 === 0 ? colors.red : colors.blue);
}
function snapAt(slot, t) {
  const tr = tracesBySlot.get(slot);
  if (!tr) return null;
  let lo = 0, hi = tr.snapshots.length - 1, best = null;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (tr.snapshots[m].t <= t) { best = tr.snapshots[m]; lo = m + 1; } else hi = m - 1; }
  return best;
}

// ---------- draw ----------
function draw() {
  if (!B) { ctx.fillStyle = "#faf9f6"; ctx.fillRect(0, 0, MAP_W, MAP_H); return; }
  const t = ticks[cur];
  document.getElementById("tickReadout").textContent = `tick ${t} / ${ticks[ticks.length - 1]}`;
  ctx.fillStyle = "#f5f2ec"; ctx.fillRect(0, 0, MAP_W, MAP_H);

  // Walls.
  ctx.fillStyle = "#c9c1b2";
  B.wall.rows.forEach((runs, y) => {
    for (let i = 0; i < runs.length; i += 2) ctx.fillRect(runs[i], y, runs[i + 1], 1);
  });

  const players = posByTick.get(t) || [];
  const overlaySlot = document.getElementById("agent").value;
  const me = overlaySlot !== "" ? players.find(p => p.slot === +overlaySlot) : null;
  const snap = overlaySlot !== "" ? snapAt(+overlaySlot, t) : null;
  document.getElementById("beliefAge").textContent =
    snap ? `${t - snap.t} ticks (snapshot @ ${snap.t})` : "—";
  const stats = document.getElementById("beliefStats");
  if (!snap) {
    stats.textContent = overlaySlot === ""
      ? "select an agent to inspect heatmap telemetry"
      : "no belief snapshot at this tick";
  } else {
    const coverage = snap.d.covered;
    const cells = coverage?.rows?.flat() || [];
    const coveredPct = cells.length
      ? (100 * cells.filter(value => value > 0).length / cells.length).toFixed(1)
      : "—";
    const headed = (snap.d.teammate_tracks || [])
      .filter(track => track.heading_brads != null).length;
    const headingStep = coverage?.heading_precision_brads != null
      ? (coverage.heading_precision_brads / 256 * 360).toFixed(1) : "—";
    const dangerMean = snap.d.danger_mean != null ? snap.d.danger_mean.toFixed(3) : "—";
    const dangerMax = snap.d.danger_max != null ? snap.d.danger_max.toFixed(3) : "—";
    stats.textContent = `covered ${coveredPct}% · allies ${snap.d.teammates_visible ?? "?"} visible / ${headed} headed · ` +
      `heading step ${headingStep}° · danger μ ${dangerMean}, max ${dangerMax}`;
  }

  // Ally-covered and danger heatmaps (under everything else).
  if (me && snap && on("t_covered") && snap.d.covered) {
    const g = snap.d.covered, cell = g.cell_px;
    g.rows.forEach((row, gy) => row.forEach((v, gx) => {
      if (v > 0) { ctx.fillStyle = `rgba(46,139,87,${(v / 255 * 0.28).toFixed(3)})`;
                   ctx.fillRect(gx * cell, gy * cell, cell, cell); }
    }));
  }
  if (me && snap && on("t_danger") && snap.d.danger) {
    const g = snap.d.danger, cell = g.cell_px;
    g.rows.forEach((row, gy) => row.forEach((v, gx) => {
      if (v > 8) { ctx.fillStyle = `rgba(179,64,46,${(v / 255 * 0.4).toFixed(3)})`;
                   ctx.fillRect(gx * cell, gy * cell, cell, cell); }
    }));
  }

  // Vision polygon.
  if (me && me.alive && on("t_vision")) {
    const aim = brads2rad(me.aim), cone = CONE_HALF_DEG * Math.PI / 180;
    ctx.beginPath();
    const N = 240;
    for (let i = 0; i <= N; i++) {
      const a = -Math.PI + (i / N) * 2 * Math.PI;
      let delta = Math.abs(((a - aim) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI);
      const maxLen = delta <= cone ? 1400 : BUBBLE;
      const [ex, ey] = ray(me.x, me.y, a, maxLen);
      i === 0 ? ctx.moveTo(ex, ey) : ctx.lineTo(ex, ey);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(232,217,144,0.20)"; ctx.fill();
    ctx.strokeStyle = "rgba(138,109,31,0.45)"; ctx.lineWidth = 1; ctx.stroke();
  }

  // Chat hearing radius.
  if (me && me.alive && on("t_hearing")) {
    ctx.beginPath(); ctx.arc(me.x, me.y, CHAT_RANGE, 0, 2 * Math.PI);
    ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(138,109,31,0.6)"; ctx.stroke();
    ctx.setLineDash([]);
  }

  // Heard chats + sounds: trace point-events within the last ~36 ticks.
  if (me && snap && on("t_heard")) {
    for (const ev of snap.d.heard_events_live || []) {
      if (!ev.pos || ev.age > 36) continue;
      const fade = 1 - ev.age / 36;
      ctx.beginPath(); ctx.arc(ev.pos[0], ev.pos[1], 8 + (1 - fade) * 10, 0, 2 * Math.PI);
      ctx.strokeStyle = `rgba(138,109,31,${0.8 * fade})`; ctx.stroke();
    }
    const tr = tracesBySlot.get(+overlaySlot);
    for (const ev of tr.events) {
      if (ev.t > t || ev.t < t - 36) continue;
      const fade = 1 - (t - ev.t) / 36;
      if (ev.name === "heard_chat" && ev.d.pos) {
        ctx.fillStyle = `rgba(138,109,31,${0.9 * fade})`;
        ctx.font = "600 10px sans-serif";
        ctx.fillText(`✉ ${ev.d.text}`, ev.d.pos[0] + 6, ev.d.pos[1] - 6);
        dot(ev.d.pos[0], ev.d.pos[1], 3, `rgba(138,109,31,${fade})`);
      } else if (ev.name === "heard_sound" && ev.d.pos) {
        ctx.beginPath(); ctx.arc(ev.d.pos[0], ev.d.pos[1], 8 + (1 - fade) * 10, 0, 2 * Math.PI);
        ctx.strokeStyle = `rgba(138,109,31,${0.8 * fade})`; ctx.stroke();
      }
    }
  }

  // Item beliefs.
  if (me && snap && on("t_items") && snap.d.item_spawns) {
    for (const s of snap.d.item_spawns) {
      const [x, y] = s.pos;
      ctx.font = "600 9px sans-serif";
      if (s.present) { dot(x, y, 4, "#3f7d3a"); ctx.fillStyle = "#3f7d3a"; }
      else { ctx.strokeStyle = "#9a938a"; ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * Math.PI); ctx.stroke(); ctx.fillStyle = "#9a938a"; }
      ctx.fillText(s.kind[0].toUpperCase(), x + 6, y + 3);
    }
  }

  // Enemy / ally track beliefs.
  if (me && snap) {
    const enemyTracks = Array.isArray(snap.d.enemy_tracks) ? snap.d.enemy_tracks : [];
    const allyTracks = Array.isArray(snap.d.teammate_tracks) ? snap.d.teammate_tracks : [];
    if (on("t_enemies")) for (const tr of enemyTracks) trackGlyph(tr, "#b3402e");
    if (on("t_allies")) for (const tr of allyTracks) trackGlyph(tr, "#2e5cb3");
    if (on("t_squad") && snap.d.presence_age) {
      // Squadmate presence: ring at last-known ally-track pos per stale seat, or a
      // panel-corner list when no position is known.
      let yy = 14;
      for (const [seat, age] of Object.entries(snap.d.presence_age)) {
        const stale = age > 190;
        ctx.font = "600 10px sans-serif";
        ctx.fillStyle = stale ? "#b3402e" : "#3f7d3a";
        ctx.fillText(`mate ${seat}: ${stale ? "STALE" : "ok"} (${age}t)`, 8, yy);
        yy += 13;
      }
    }
  }

  // Goal + path.
  if (me && snap && on("t_path") && snap.d.nav_path) {
    ctx.beginPath(); ctx.moveTo(me.x, me.y);
    for (const [px, py] of snap.d.nav_path) ctx.lineTo(px, py);
    ctx.strokeStyle = "rgba(26,24,21,0.55)"; ctx.setLineDash([3, 4]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (me && snap && on("t_goal")) {
    const o = snap.d.order, ip = snap.d.intent_point;
    if (ip) { cross(ip[0], ip[1], 7, "#1a1815"); }
    if (o) {
      const [goal, pos] = o;
      if (pos) { ctx.strokeStyle = "#1a1815"; ctx.strokeRect(pos[0] - 6, pos[1] - 6, 12, 12); }
      ctx.font = "600 11px sans-serif"; ctx.fillStyle = "#1a1815";
      ctx.fillText(`order ${goal} · ${snap.d.order_source ?? "?"} · age ${snap.d.order_age ?? "?"}t`,
                   me.x + 14, me.y - 14);
    }
  }

  // Flags.
  for (const f of flagsByTick.get(t) || []) {
    ctx.font = "700 14px sans-serif";
    ctx.fillStyle = teamColor(f.flag);
    ctx.fillText("⚑", f.x - 5, f.y + 5);
  }

  // Players (ground truth).
  for (const p of players) {
    if (!p.alive) continue;
    const col = teamColor(participantsBySlot.get(p.slot)?.team, p.slot);
    const isMe = me && p.slot === me.slot;
    dot(p.x, p.y, isMe ? 7 : 5, col);
    if (isMe) { ctx.strokeStyle = "#1a1815"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, 2 * Math.PI); ctx.stroke(); ctx.lineWidth = 1; }
    const a = brads2rad(p.aim);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(a) * 12, p.y + Math.sin(a) * 12);
    ctx.strokeStyle = col; ctx.stroke();
    if (p.carry) { ctx.font = "700 11px sans-serif"; ctx.fillStyle = "#8a6d1f"; ctx.fillText("⚑", p.x - 3, p.y - 8); }
    if (on("t_names")) {
      ctx.font = "9px sans-serif"; ctx.fillStyle = "#5f5a52";
      ctx.fillText(`s${p.slot >> 1}${p.slot % 2 ? "b" : "r"}·${p.hp}`, p.x + 7, p.y + 3);
    }
  }

  // Event flashes (kills etc. within the last 12 ticks).
  if (on("t_events")) {
    for (let dt = 0; dt <= 12; dt++) {
      for (const ev of eventsByTick.get(t - dt) || []) {
        const fade = 1 - dt / 12;
        if (ev.key === "kill" && ev.value?.victim_x != null) {
          cross(ev.value.victim_x, ev.value.victim_y, 6 + dt, `rgba(179,64,46,${fade})`);
        } else if ((ev.key === "flag_steal" || ev.key === "capture") && ev.value?.x != null) {
          ctx.font = "700 12px sans-serif"; ctx.fillStyle = `rgba(138,109,31,${fade})`;
          ctx.fillText(ev.key === "capture" ? "CAPTURE" : "steal", ev.value.x, ev.value.y - 10);
        }
      }
    }
  }

  // State card for the selected bot.
  if (me && snap && on("t_state")) {
    const d = snap.d;
    const lines = [
      `${d.team} seat ${d.seat} · ${d.objective ?? d.intent ?? "?"}${d.micro ? " · " + d.micro : ""}`,
      `hp ${d.hp_pips ?? "?"} · enemy lives ${d.enemy_lives_left ?? "?"} · converts ${d.convert_events ?? 0}`,
      `orders ${d.orders_heard ?? 0}♫/${d.orders_sent ?? 0}↑ · pings ${d.pings_heard ?? 0}♫ · backoffs ${d.backoff_events ?? 0}`,
    ];
    ctx.font = "11px sans-serif";
    const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 16;
    ctx.fillStyle = "rgba(250,249,246,0.92)";
    ctx.fillRect(MAP_W - w - 8, MAP_H - 54, w, 46);
    ctx.strokeStyle = "#e3ded6"; ctx.strokeRect(MAP_W - w - 8, MAP_H - 54, w, 46);
    ctx.fillStyle = "#1a1815";
    lines.forEach((l, i) => ctx.fillText(l, MAP_W - w, MAP_H - 40 + i * 13));
  }
}

function dot(x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fillStyle = col; ctx.fill(); }
function cross(x, y, r, col) {
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r);
  ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke();
}
function trackGlyph(tr, col) {
  const [x, y] = tr.pos, alpha = Math.max(0.15, 1 - tr.age / 120);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(x, y, 6, 0, 2 * Math.PI); ctx.stroke();
  if (tr.vel && (tr.vel[0] || tr.vel[1])) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + tr.vel[0] * 10, y + tr.vel[1] * 10); ctx.stroke();
  }
  if (tr.heading_brads != null) {
    const a = brads2rad(tr.heading_brads);
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * 12, y + Math.sin(a) * 12); ctx.stroke();
  }
  ctx.font = "9px sans-serif"; ctx.fillStyle = col;
  ctx.fillText(`${tr.age}t`, x + 8, y - 6);
  ctx.globalAlpha = 1;
}

const bundleUrl = queryParams.get("bundle");
if (bundleUrl) {
  fetch(bundleUrl).then(response => {
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    return response.json();
  }).then(bundle => loadBundle(bundle, bundleUrl.split("/").pop()))
    .catch(error => status(`failed to load ${bundleUrl}: ${error}`));
} else {
  draw();
}
</script>
</body>
</html>
